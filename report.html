<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKR OS | V3.0 - بروتوكول الإغلاق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        osDark: '#030712', /* أسود عميق */
                        osCard: 'rgba(17, 24, 39, 0.65)', /* زجاجي */
                        osAccent: '#3b82f6', /* أزرق ساطع */
                        osGold: '#fbbf24',
                        osSuccess: '#10b981',
                        osDanger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #030712; 
            color: #f8fafc; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08), transparent 25%);
        }
        
        /* تأثيرات الزجاج (Glassmorphism) */
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .step-content { display: none; opacity: 0; transform: scale(0.95); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-content.active { display: block; opacity: 1; transform: scale(1); animation: slideUp 0.5s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* تصميم أزرار الاختيار للصلوات */
        .prayer-radio input:checked ~ .p-mosque { background: linear-gradient(135deg, #059669, #10b981); color: white; border-color: transparent; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }
        .prayer-radio input:checked ~ .p-home { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border-color: transparent; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); transform: translateY(-2px); }
        .prayer-radio input:checked ~ .p-missed { background: linear-gradient(135deg, #dc2626, #ef4444); color: white; border-color: transparent; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); transform: translateY(-2px); }
        
        /* تصميم أزرار الدايت */
        .diet-radio input:checked ~ .d-strict { background: #10b981; color: #000; border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .diet-radio input:checked ~ .d-partial { background: #fbbf24; color: #000; border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.3); }
        .diet-radio input:checked ~ .d-failed { background: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }

        /* مفاتيح التبديل العصرية */
        .cyber-toggle input:checked + div {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.3));
            border-color: #3b82f6;
            color: white;
            box-shadow: inset 4px 0 0 #3b82f6, 0 0 15px rgba(59,130,246,0.2);
        }
        .cyber-toggle input:checked + div i { color: #60a5fa; transform: scale(1.1); }
        
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* الدائرة النهائية */
        .progress-ring__circle { transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(-90deg); transform-origin: 50% 50%; }
        .glow-text { text-shadow: 0 0 20px currentColor; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- الحاوية الرئيسية الزجاجية -->
    <div id="mainCard" class="glass-panel w-full max-w-md rounded-[2.5rem] overflow-hidden relative z-10 transition-all duration-500">
        
        <!-- الهيدر العلوي -->
        <div id="formHeader" class="p-6 pb-4 border-b border-white/5 relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-osAccent to-transparent opacity-50"></div>
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-black text-white text-xl tracking-widest"><i class="fa-solid fa-bolt text-osAccent mr-2"></i>SAKR<span class="text-slate-500 font-light">OS</span></h1>
                <span id="stepIndicator" class="bg-blue-500/10 text-osAccent px-3 py-1 rounded-full text-xs font-bold border border-blue-500/20">خطوة 1 / 4</span>
            </div>
            
            <h2 id="stepTitle" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-l from-white to-slate-400">الروحانيات والفرائض</h2>
            
            <div class="w-full bg-slate-800/50 rounded-full h-1 mt-5 overflow-hidden">
                <div id="stepProgressBar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 25%"></div>
            </div>
        </div>

        <form id="dailyReportForm" class="p-6">
            
            <!-- الخطوة 1: الصلوات والقرآن -->
            <div id="step1" class="step-content active space-y-5">
                <div class="space-y-3" id="prayersContainer">
                    <!-- سيتم حقن الصلوات عبر الجافاسكربت لتقليل التكرار -->
                </div>

                <div class="pt-4 mt-4 border-t border-white/5">
                    <label class="cyber-toggle cursor-pointer block">
                        <input type="checkbox" id="quran" class="hidden">
                        <div class="p-4 rounded-2xl border border-slate-700/50 bg-slate-800/30 text-base font-bold text-slate-400 transition-all flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center border border-slate-700">
                                    <i class="fa-solid fa-book-open text-slate-500 transition-colors"></i>
                                </div>
                                <span>إتمام الورد القرآني</span>
                            </div>
                            <i class="fa-solid fa-check text-xl opacity-0 transition-opacity"></i>
                        </div>
                    </label>
                </div>
            </div>

            <!-- الخطوة 2: الجسد والمظهر -->
            <div id="step2" class="step-content space-y-6">
                
                <div class="bg-slate-900/50 p-5 rounded-3xl border border-white/5">
                    <div class="flex items-center gap-3 mb-4">
                        <i class="fa-solid fa-fire text-osSuccess text-xl"></i>
                        <h3 class="text-lg font-bold text-white">النظام الغذائي</h3>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="diet-radio cursor-pointer">
                            <input type="radio" name="diet" value="strict" class="hidden" checked>
                            <div class="d-strict p-3 rounded-xl border border-slate-700 bg-slate-800/50 text-sm font-bold text-slate-300 text-center transition-all">التحام كامل (100%)</div>
                        </label>
                        <div class="flex gap-2">
                            <label class="diet-radio cursor-pointer flex-1">
                                <input type="radio" name="diet" value="partial" class="hidden">
                                <div class="d-partial p-3 rounded-xl border border-slate-700 bg-slate-800/50 text-xs font-bold text-slate-300 text-center transition-all">انحراف طفيف</div>
                            </label>
                            <label class="diet-radio cursor-pointer flex-1">
                                <input type="radio" name="diet" value="failed" class="hidden">
                                <div class="d-failed p-3 rounded-xl border border-slate-700 bg-slate-800/50 text-xs font-bold text-slate-300 text-center transition-all">فشل النظام</div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="cyber-toggle cursor-pointer block">
                        <input type="checkbox" id="minox" class="hidden">
                        <div class="p-4 rounded-2xl border border-slate-700/50 bg-slate-800/30 text-base font-bold text-slate-400 transition-all flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center border border-slate-700"><i class="fa-solid fa-droplet text-indigo-400 transition-colors"></i></div>
                            <span>جلسة المينوكسديل</span>
                        </div>
                    </label>
                    
                    <label class="cyber-toggle cursor-pointer block">
                        <input type="checkbox" id="skincare" class="hidden">
                        <div class="p-4 rounded-2xl border border-slate-700/50 bg-slate-800/30 text-base font-bold text-slate-400 transition-all flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center border border-slate-700"><i class="fa-solid fa-wand-magic-sparkles text-teal-400 transition-colors"></i></div>
                            <span>العناية بالبشرة</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- الخطوة 3: العمل والإنجاز (تمت إزالة اليوتيوب) -->
            <div id="step3" class="step-content space-y-6 text-center py-4">
                <div class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-900 to-slate-900 flex items-center justify-center mx-auto mb-6 border border-blue-500/30 shadow-[0_0_30px_rgba(59,130,246,0.15)]">
                    <i class="fa-solid fa-briefcase text-4xl text-blue-400"></i>
                </div>
                
                <h3 class="text-xl font-bold text-white mb-2">العمل والإنتاجية</h3>
                <p class="text-sm text-slate-400 mb-8">هل أتممت مهام العمل الأساسية والمستهدفة لليوم بنجاح؟</p>

                <label class="cyber-toggle cursor-pointer block relative">
                    <input type="checkbox" id="workDone" class="hidden peer">
                    <div class="py-6 rounded-3xl border-2 border-slate-700 bg-slate-800/50 text-xl font-black text-slate-400 text-center transition-all peer-checked:bg-osAccent peer-checked:border-osAccent peer-checked:text-white peer-checked:shadow-[0_0_40px_rgba(59,130,246,0.4)]">
                        نعم، تم الإنجاز 🚀
                    </div>
                </label>
            </div>

            <!-- الخطوة 4: الخزنة -->
            <div id="step4" class="step-content space-y-6">
                <div class="text-center mb-6">
                    <h2 class="text-xl font-black text-white">الخزنة والأصول</h2>
                    <p class="text-xs text-slate-500 mt-1">تسجيل المدخلات اليومية للثروة</p>
                </div>

                <div class="space-y-4">
                    <div class="relative bg-slate-900/80 p-5 rounded-2xl border border-slate-700 overflow-hidden group focus-within:border-osGold transition-colors">
                        <div class="absolute right-0 top-0 bottom-0 w-1 bg-osGold opacity-50 group-focus-within:opacity-100 transition-opacity"></div>
                        <label class="block text-xs font-bold text-slate-400 mb-2">ذهب مُضاف (بالجرام)</label>
                        <div class="flex items-center">
                            <span class="text-osGold mr-2 text-xl"><i class="fa-solid fa-weight-scale"></i></span>
                            <input type="number" step="0.01" id="addGold" placeholder="0.00" class="w-full bg-transparent text-3xl font-black text-white focus:outline-none placeholder-slate-700">
                            <span class="text-slate-600 font-bold ml-2">g</span>
                        </div>
                    </div>
                    
                    <div class="relative bg-slate-900/80 p-5 rounded-2xl border border-slate-700 overflow-hidden group focus-within:border-osSuccess transition-colors">
                        <div class="absolute right-0 top-0 bottom-0 w-1 bg-osSuccess opacity-50 group-focus-within:opacity-100 transition-opacity"></div>
                        <label class="block text-xs font-bold text-slate-400 mb-2">سيولة نقدية مُضافة</label>
                        <div class="flex items-center">
                            <span class="text-osSuccess mr-2 text-xl"><i class="fa-solid fa-money-bill-wave"></i></span>
                            <input type="number" id="addCash" placeholder="0" class="w-full bg-transparent text-3xl font-black text-white focus:outline-none placeholder-slate-700">
                            <span class="text-slate-600 font-bold ml-2">EGP</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- أزرار التحكم -->
            <div class="mt-8 flex gap-3">
                <button type="button" id="prevBtn" class="hidden w-16 bg-slate-800/50 text-slate-300 font-bold py-4 rounded-2xl border border-white/5 hover:bg-slate-700 transition-all flex items-center justify-center">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button type="button" id="nextBtn" class="flex-1 bg-white text-black font-black text-lg py-4 rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:scale-[0.98] transition-transform">
                    متابعة
                </button>
                <button type="button" id="submitBtn" class="hidden flex-1 bg-gradient-to-r from-osSuccess to-emerald-400 text-black font-black text-lg py-4 rounded-2xl shadow-[0_0_25px_rgba(16,185,129,0.3)] hover:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                    <i class="fa-solid fa-fingerprint"></i> تأكيد وإغلاق
                </button>
            </div>
        </form>
        
        <!-- شاشة النتيجة الدائرية -->
        <div id="resultScreen" class="hidden p-8 text-center pb-12 flex flex-col items-center justify-center min-h-[400px]">
            <h2 class="text-sm font-bold text-slate-400 tracking-widest mb-6 uppercase">System Closed</h2>
            
            <div class="relative w-40 h-40 mb-8 flex items-center justify-center">
                <svg class="absolute inset-0 w-full h-full drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="#1e293b" stroke-width="8" />
                    <circle id="progressCircle" class="progress-ring__circle" cx="60" cy="60" r="54" fill="none" stroke="#3b82f6" stroke-width="8" stroke-dasharray="339.292" stroke-dashoffset="339.292" stroke-linecap="round" />
                </svg>
                <div class="absolute flex flex-col items-center justify-center">
                    <span id="scoreText" class="text-4xl font-black text-white glow-text">0%</span>
                </div>
            </div>
            
            <div class="flex gap-4 w-full mb-8">
                <div class="flex-1 bg-slate-900/50 rounded-2xl p-3 border border-white/5">
                    <div class="text-[10px] text-slate-500 mb-1">نقاط الخبرة</div>
                    <div class="text-xl font-black text-osGold">+<span id="earnedXP">0</span></div>
                </div>
                <div class="flex-1 bg-slate-900/50 rounded-2xl p-3 border border-white/5">
                    <div class="text-[10px] text-slate-500 mb-1">الحالة</div>
                    <div id="statusText" class="text-sm font-black text-white">جاري التقييم</div>
                </div>
            </div>
            
            <button onclick="window.location.reload()" class="w-full bg-slate-800 text-white font-bold text-sm py-4 rounded-2xl border border-white/10 hover:bg-slate-700 transition-all">
                إنهاء الجلسة
            </button>
        </div>

    </div>

    <script>
        // --- 1. بناء واجهة الصلوات ديناميكياً ---
        const prayers = [
            { id: 'fajr', name: 'الفجر' }, { id: 'dhuhr', name: 'الظهر' }, 
            { id: 'asr', name: 'العصر' }, { id: 'maghrib', name: 'المغرب' }, { id: 'isha', name: 'العشاء' }
        ];
        
        const prayersContainer = document.getElementById('prayersContainer');
        prayers.forEach(p => {
            prayersContainer.innerHTML += `
                <div class="flex items-center justify-between bg-slate-900/40 p-2 rounded-2xl border border-white/5">
                    <span class="text-white font-bold text-sm w-16 text-center">${p.name}</span>
                    <div class="flex flex-1 gap-1 bg-slate-950 p-1 rounded-xl ml-2">
                        <label class="prayer-radio flex-1 cursor-pointer">
                            <input type="radio" name="${p.id}" value="mosque" class="hidden">
                            <div class="p-mosque py-2 rounded-lg border border-transparent bg-transparent text-xs font-bold text-slate-500 text-center transition-all">مسجد</div>
                        </label>
                        <label class="prayer-radio flex-1 cursor-pointer">
                            <input type="radio" name="${p.id}" value="home" class="hidden" checked>
                            <div class="p-home py-2 rounded-lg border border-transparent bg-transparent text-xs font-bold text-slate-500 text-center transition-all">بيت</div>
                        </label>
                        <label class="prayer-radio flex-1 cursor-pointer">
                            <input type="radio" name="${p.id}" value="missed" class="hidden">
                            <div class="p-missed py-2 rounded-lg border border-transparent bg-transparent text-xs font-bold text-slate-500 text-center transition-all">فاتني</div>
                        </label>
                    </div>
                </div>
            `;
        });

        // Toggle Icon Update for Custom Checkboxes
        document.querySelectorAll('.cyber-toggle input').forEach(input => {
            input.addEventListener('change', function() {
                const icon = this.nextElementSibling.querySelector('.fa-check');
                if(icon) {
                    if(this.checked) {
                        icon.classList.remove('opacity-0');
                        icon.classList.add('text-blue-400');
                    } else {
                        icon.classList.add('opacity-0');
                    }
                }
            });
        });

        // --- 2. إدارة الخطوات ---
        let currentStep = 1;
        const totalSteps = 4;
        const stepTitles = ["الروحانيات والفرائض", "الجسد والمظهر", "العمل والإنتاجية", "الخزنة والأصول"];

        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const submitBtn = document.getElementById('submitBtn');
        const stepIndicator = document.getElementById('stepIndicator');
        const stepTitle = document.getElementById('stepTitle');
        const stepProgressBar = document.getElementById('stepProgressBar');

        function updateUI() {
            stepIndicator.innerText = `خطوة ${currentStep} / ${totalSteps}`;
            stepTitle.innerText = stepTitles[currentStep - 1];
            stepProgressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
            
            if(currentStep === 1) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }
            
            if (currentStep === totalSteps) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                document.getElementById(`step${currentStep}`).classList.remove('active');
                currentStep++;
                document.getElementById(`step${currentStep}`).classList.add('active');
                updateUI();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                document.getElementById(`step${currentStep}`).classList.remove('active');
                currentStep--;
                document.getElementById(`step${currentStep}`).classList.add('active');
                updateUI();
            }
        });

        // --- 3. الحسابات والنتيجة ---
        submitBtn.addEventListener('click', () => {
            // أ. جمع البيانات (بدون يوتيوب)
            const reportData = {
                prayers: {
                    fajr: document.querySelector('input[name="fajr"]:checked').value,
                    dhuhr: document.querySelector('input[name="dhuhr"]:checked').value,
                    asr: document.querySelector('input[name="asr"]:checked').value,
                    maghrib: document.querySelector('input[name="maghrib"]:checked').value,
                    isha: document.querySelector('input[name="isha"]:checked').value,
                },
                quran: document.getElementById('quran').checked,
                diet: document.querySelector('input[name="diet"]:checked').value,
                minox: document.getElementById('minox').checked,
                skincare: document.getElementById('skincare').checked,
                workDone: document.getElementById('workDone').checked,
                addedGold: parseFloat(document.getElementById('addGold').value) || 0,
                addedCash: parseFloat(document.getElementById('addCash').value) || 0
            };

            // ب. حساب التقييم (من 100%)
            let score = 0;
            
            // 1. الصلوات (40 نقطة كحد أقصى: 8 للمسجد، 4 للبيت)
            Object.values(reportData.prayers).forEach(val => {
                if(val === 'mosque') score += 8;
                else if(val === 'home') score += 4;
            });

            // 2. القرآن (10 نقاط)
            if(reportData.quran) score += 10;

            // 3. الدايت (20 نقطة)
            if(reportData.diet === 'strict') score += 20;
            else if(reportData.diet === 'partial') score += 10;

            // 4. العناية (10 نقاط)
            if(reportData.minox) score += 5;
            if(reportData.skincare) score += 5;

            // 5. العمل (20 نقطة)
            if(reportData.workDone) score += 20;

            score = Math.min(score, 100);

            // ج. حساب نقاط الخبرة (XP)
            let xpEarned = Math.round(score * 2); // نقاط أساسية
            if (reportData.addedGold > 0) xpEarned += 50;
            if (reportData.addedCash > 0) xpEarned += 20;

            // حفظ محلي (LocalStorage)
            let currentXP = parseInt(localStorage.getItem('SakrOS_TotalXP')) || 0;
            localStorage.setItem('SakrOS_TotalXP', currentXP + xpEarned);

            // د. عرض الشاشة النهائية بتأثير احترافي
            showResultScreen(score, xpEarned);
        });

        function showResultScreen(score, xpEarned) {
            document.getElementById('dailyReportForm').classList.add('hidden');
            document.getElementById('formHeader').classList.add('hidden');
            const resultScreen = document.getElementById('resultScreen');
            resultScreen.classList.remove('hidden');
            
            const scoreText = document.getElementById('scoreText');
            const progressCircle = document.getElementById('progressCircle');
            const statusText = document.getElementById('statusText');
            document.getElementById('earnedXP').innerText = xpEarned;

            // تحديد اللون والحالة بناءً على النتيجة
            let color = '#ef4444'; // Danger
            let status = 'أداء ضعيف';
            
            if(score >= 85) { color = '#10b981'; status = 'ممتاز (إمبراطور)'; } // Success
            else if(score >= 60) { color = '#3b82f6'; status = 'جيد (مستقر)'; } // Blue
            else if(score >= 40) { color = '#fbbf24'; status = 'مقبول (يحتاج تحسين)'; } // Warning

            progressCircle.style.stroke = color;
            scoreText.style.color = color;
            statusText.innerText = status;
            statusText.style.color = color;

            // أنيميشن العداد الدائري (المحيط = 339.292)
            const radius = progressCircle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (score / 100) * circumference;
            
            // عداد الأرقام
            let currentVal = 0;
            let duration = 1500; // 1.5 seconds
            let interval = 20;
            let step = (score / (duration / interval));

            setTimeout(() => {
                progressCircle.style.strokeDashoffset = offset;
                let counter = setInterval(() => {
                    currentVal += step;
                    if(currentVal >= score) {
                        currentVal = score;
                        clearInterval(counter);
                        if(score >= 60) {
                            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: [color, '#ffffff', '#fbbf24'] });
                        }
                    }
                    scoreText.innerText = Math.round(currentVal) + '%';
                }, interval);
            }, 100);
        }
    </script>
</body>
</html>
